name: Checks

# The source-level half of the Fix system.
#
# The 🛠 Fix panel inside the app checks what only a running browser can see:
# real errors, files missing from offline storage, damaged saved data, broken
# buttons. It cannot check the source files for problems that never surface at
# runtime — and it cannot write a fix back to a file, because a browser cannot
# edit the site it is loading.
#
# So that half runs here instead, on every push, with the free open-source
# tools: ESLint for JavaScript, Stylelint for CSS, HTMLHint for the markup,
# plus this project's own two consistency checks (the catalogue is rebuilt to
# prove it matches data/, and the service worker's offline file list is
# compared against the files the page actually loads).
#
# Nothing here is installed into the repo: npx fetches each tool for the run.
# All of it is free on GitHub's own runners for a public repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript (ESLint)
        run: npx --yes eslint@9

      - name: CSS (Stylelint)
        # ignore@7.0.11 is listed on npm but its file is missing (404), and
        # stylelint 16 pulls the newest 7.0.x, so a plain `npx stylelint@16`
        # can't install at all. Installed with that one package held at 7.0.10.
        run: |
          mkdir -p /tmp/stylelint && cd /tmp/stylelint
          echo '{"private":true,"overrides":{"ignore":"7.0.10"}}' > package.json
          npm install --no-audit --no-fund --silent stylelint@16
          cd "$GITHUB_WORKSPACE" && /tmp/stylelint/node_modules/.bin/stylelint "web/css/*.css"

      - name: HTML (HTMLHint)
        run: npx --yes htmlhint@1 "web/index.html"

      - name: Every JSON file parses
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for f in sorted(glob.glob('data/**/*.json', recursive=True)) + ['web/plans.json', 'web/manifest.json']:
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          for b in bad:
              print(b)
          print(f'{len(bad)} invalid' if bad else 'all JSON files parse')
          sys.exit(1 if bad else 0)
          PY

      - name: Offline file list matches the page
        run: python3 tools/check-precache.py

      # web/js/*.js is still where every feature is written and reviewed;
      # web/bundles/*.js is what index.html actually loads. Nothing rebuilds
      # the bundles automatically, so a change to a module that isn't
      # followed by rebuilding its bundle would ship silently stale code —
      # this is what catches that before it reaches main.
      - name: web/bundles/*.js match web/js/*.js
        run: |
          python3 tools/build-bundles.py
          git diff --exit-code web/bundles/ || {
            echo ''
            echo 'web/bundles/*.js is out of date with web/js/.'
            echo 'Run: python3 tools/build-bundles.py  — and commit the result.'
            exit 1
          }

      # No live-publish workflow rebuilds this one on merge (unlike
      # plans.json below), so there is no race to dodge — this can run on
      # every push, including main, and it is the only thing standing
      # between an edited data/aaup/contacts.json and a stale (or
      # accidentally phone-number-carrying) web/contacts.json shipping to
      # students.
      - name: web/contacts.json matches data/, and carries no phone numbers
        run: |
          python3 tools/build-contacts.py
          git diff --exit-code web/contacts.json || {
            echo ''
            echo 'web/contacts.json is out of date with data/.'
            echo 'Run: python3 tools/build-contacts.py  — and commit the result.'
            exit 1
          }

      - name: Plans add up to the degree they claim
        run: python3 tools/check-plan-hours.py

      # On a pull request this is a real guard: Publish catalogue only runs on
      # main, so a PR that edits data/ without committing the rebuild would
      # merge a plans.json that disagrees with its own source.
      #
      # On main it is a race it always loses. An admin save commits to data/,
      # and Publish catalogue rebuilds plans.json in a *separate* commit
      # moments later — so this check runs against the admin commit, correctly
      # observes that plans.json has not caught up yet, and fails. The next
      # commit passes. The result was a red X on every single admin edit for
      # something that was already fixing itself, which is precisely how a CI
      # signal gets tuned out — and this repo could not afford that, because a
      # genuinely broken publish had been sitting in the same tab for hours.
      #
      # Nothing is lost by skipping it there. Publish catalogue rebuilds
      # plans.json on main and fails loudly if it cannot, so it is both the
      # mechanism and the alarm; this step would only be repeating its answer a
      # few seconds too early.
      - name: web/plans.json matches data/
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
        run: |
          python3 tools/build-catalogue.py
          git diff --exit-code web/plans.json || {
            echo ''
            echo 'web/plans.json is out of date with data/.'
            echo 'Run: python3 tools/build-catalogue.py  — and commit the result.'
            exit 1
          }
