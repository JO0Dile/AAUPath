name: Publish catalogue

# web/plans.json is generated from data/ and committed alongside it, so the app
# can ship its whole catalogue as one static file with no server. That works
# when a human edits data/ and runs the build themselves — but Admin Mode
# commits to data/ through a Worker, and a Worker cannot run Python.
#
# Without this, an admin edit landed in data/, plans.json stayed at the old
# content, the app kept serving the old content, and the Checks workflow failed
# with "run build-catalogue.py and commit the result" — which nobody was there
# to read. The change looked saved and simply never appeared.
#
# So: whenever data/ changes on main, rebuild and commit the result. That is the
# step the admin flow was missing, and it is what makes "live in about a minute"
# actually true.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/build-catalogue.py'
      - '.github/workflows/publish-catalogue.yml'
  workflow_dispatch:
  # Every day, so next year's plan goes live on its date by itself
  # (tools/promote-drafts.py). Nothing happens on a day with no due draft.
  schedule:
    - cron: '17 0 * * *'

# contents: write to push the rebuilt file back, actions: write to ask for the
# Pages deploy at the end.
#
# actions: write is not optional and its absence is not obvious. Naming a
# permissions block at all sets every scope you do not list to *none*, so
# `contents: write` alone silently removed the one the deploy step needs. Every
# run then did the same thing: committed the rebuilt plans.json successfully,
# then died on
#
#   POST /actions/workflows/pages.yml/dispatches -> 403
#   Resource not accessible by integration
#
# Twelve runs in a row failed exactly there. The commits all landed, so data/
# and plans.json stayed correct and nothing looked wrong in the repo — but the
# site was never redeployed, so it sat frozen on an old build for hours while
# admin edits appeared to do nothing at all.
permissions:
  contents: write
  actions: write

# Two admin saves in quick succession would otherwise race and one would land on
# a stale checkout. Queue them instead of cancelling: every edit must be built.
concurrency:
  group: publish-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put any next year's plan live whose date has come
        run: python3 tools/promote-drafts.py

      - name: Rebuild web/plans.json from data/
        run: python3 tools/build-catalogue.py

      - name: Commit it, if it changed
        run: |
          if git diff --quiet -- web/plans.json data/; then
            echo "plans.json already matches data/ — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ too: a draft that went live today changed its major's file.
          git add web/plans.json data/
          git commit -m "build: rebuild plans.json from data/

          Generated by the publish-catalogue workflow after a change to data/.
          The app reads this file directly, so it has to move with its source."

          # Two admin saves seconds apart both rebuild, and the second pushes
          # onto a main that already moved. Rebase and retry rather than fail —
          # a failed publish is invisible to whoever pressed Save.
          for attempt in 1 2 3; do
            if git push; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing and retrying ($attempt/3)"
            git pull --rebase origin main || exit 1
          done
          echo "::error::Could not push the rebuilt plans.json after 3 attempts."
          echo "If this says 403 or 'permission denied', open"
          echo "Settings -> Actions -> General -> Workflow permissions"
          echo "and select 'Read and write permissions'."
          exit 1

      # A push made with GITHUB_TOKEN deliberately does NOT trigger other
      # workflows — GitHub blocks that to prevent runaway loops. So committing
      # plans.json here would never start the Pages deploy, and the rebuilt file
      # would sit in the repo un-served. Asking for the deploy explicitly is the
      # supported way out of that.
      - name: Deploy the site with the rebuilt catalogue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'pages.yml',
                ref: 'main',
              });
              core.info('Requested a Pages deploy.');
            } catch (e) {
              // Do not fail the run. Pages also deploys from this workflow
              // finishing (the workflow_run trigger in pages.yml), so the site
              // still updates — and failing here would hide a rebuild that
              // actually succeeded behind a red X, which is how this went
              // unnoticed for twelve runs.
              core.warning(
                `Could not request a Pages deploy directly (${e.status || ''} ${e.message}). ` +
                'Falling back to the workflow_run trigger in pages.yml, so the deploy should ' +
                'still happen. If this says 403 "Resource not accessible by integration", this ' +
                "workflow's permissions block is missing actions: write.");
            }
