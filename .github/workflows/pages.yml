name: Deploy web/ to GitHub Pages

# Publishes the web/ folder as a static site — this workflow IS the app's
# hosting: it's what puts https://jo0dile.github.io/AAUPath/ online and
# updates it on every push to main. The app is fully self-contained (its
# catalogue ships in web/plans.json), so this is the only deployment there is.
#
# configure-pages' `enablement: true` below makes it create the Pages site
# itself on first run (its default is to error out instead, expecting a
# manual "Settings -> Pages -> Source -> GitHub Actions" click first) — so
# there's no manual repo-settings step needed before this works.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

  # The admin path cannot use the push trigger above: Publish catalogue commits
  # the rebuilt plans.json with GITHUB_TOKEN, and GitHub deliberately does not
  # let a GITHUB_TOKEN push start another workflow. So it asks for a deploy
  # explicitly instead — and when that request was refused for want of a
  # permission, there was no second route and the site quietly stopped updating
  # while every admin edit still committed perfectly. Nothing in the repo looked
  # wrong; it was just never served.
  #
  # This is that second route. It needs no token scope at all, so a permissions
  # mistake can slow the deploy down but can no longer stop it. Double deploys
  # are harmless — the concurrency group below serialises them.
  workflow_run:
    workflows: ["Publish catalogue"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
